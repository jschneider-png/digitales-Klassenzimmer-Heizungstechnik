<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundenauftrag · Verbrennung verstehen</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17364d;background:#edf5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top a{font-weight:800;color:#23658b;text-decoration:none}.pill{background:#dceaf2;border-radius:20px;padding:7px 12px;font-weight:800;font-size:.82rem}.stage{background:white;border:1px solid #c8dce8;border-radius:22px;min-height:410px;padding:clamp(20px,5vw,48px);margin:20px 0;box-shadow:0 16px 40px #17405c16}h1{font-size:clamp(1.4rem,3vw,2rem)}h2{font-size:clamp(1.45rem,4vw,2.3rem)}p,li{font-size:clamp(1.05rem,2vw,1.2rem);line-height:1.65}.formula{background:#e6f2f8;border-left:5px solid #23658b;border-radius:10px;padding:17px;font-size:clamp(1.07rem,2.5vw,1.4rem);font-weight:750;line-height:1.6;margin:16px 0}.tip{background:#fff4dd;border-left:5px solid #e9a43c;border-radius:9px;padding:14px;line-height:1.6}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav button,.answerbtn{border:0;border-radius:12px;background:#23658b;color:white;font:800 1rem system-ui;padding:13px 18px;cursor:pointer}.nav button:disabled{opacity:.4;cursor:not-allowed}.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:17px}.dots button{border:0;border-radius:15px;background:#b4cbd8;height:10px;width:27px;cursor:pointer}.dots button[aria-current="step"]{background:#23658b}.answer[hidden]{display:none!important}
</style></head><body><main class="wrap"><div class="top"><a href="lernpfad.html?bw=2">← Zurück zum Lernpfad</a><span class="pill">BW 2 · Stunde 3</span></div><h1>Kundenauftrag: Warum rußt die Ölheizung?</h1><section class="stage" id="stage" aria-live="polite"></section><nav class="nav"><button id="prev" type="button">← Zurück</button><strong id="counter"></strong><button id="next" type="button">Weiter →</button></nav><div class="dots" id="dots"></div></main><script>
const slides=[
['Ein Kunde meldet sich','<p>„Meine Ölheizung rußt plötzlich. Außerdem riecht es im Heizraum ungewöhnlich. Muss ich mir Sorgen machen?“</p><p><strong>Auftrag:</strong> Erkläre, wie eine richtige Verbrennung funktioniert, welche Fehler denkbar sind und was fachgerecht zu prüfen ist.</p><div class="tip"><strong>Sicherheit:</strong> Bei auffälligem Geruch, Ruß oder vermutetem Abgasaustritt Anlage nicht selbst einstellen. Fachbetrieb einschalten; bei Verdacht auf CO/Abgasaustritt Bereich verlassen und Hilfe rufen.</div>'],
['1 · Was brauchen wir zum Verbrennen?','<p>Eine Verbrennung braucht drei Voraussetzungen:</p><ul><li><strong>Brennstoff</strong> – hier Heizöl</li><li><strong>Sauerstoff</strong> aus der Verbrennungsluft</li><li><strong>Zündenergie</strong> beziehungsweise ausreichend hohe Temperatur</li></ul><div class="tip">Denkfrage: Was passiert, wenn eine der drei Voraussetzungen fehlt?</div>'],
['2 · Was steckt im Heizöl?','<p>Heizöl besteht überwiegend aus Kohlenwasserstoffen. Diese enthalten <strong>Kohlenstoff (C)</strong> und <strong>Wasserstoff (H)</strong>.</p><p>Bei vollständiger Verbrennung reagieren diese mit Sauerstoff. Dabei wird Wärme frei.</p>'],
['3 · Vollständige Verbrennung','<p>Bei ausreichender Sauerstoffzufuhr entstehen vor allem <strong>Kohlenstoffdioxid (CO₂)</strong> und <strong>Wasser (H₂O)</strong>.</p><div class="formula">C + O₂ → CO₂<br>2 H₂ + O₂ → 2 H₂O</div><p>Dies sind vereinfachte Teilreaktionen – Heizöl ist ein Gemisch und hat keine einzelne exakte Summenformel.</p>'],
['4 · Unvollständige Verbrennung','<p>Wenn Brennstoff und Luft nicht richtig gemischt werden oder örtlich zu wenig Sauerstoff vorhanden ist, kann die Verbrennung unvollständig sein.</p><div class="formula">2 C + O₂ → 2 CO</div><p>Dabei können <strong>Kohlenstoffmonoxid (CO)</strong>, unverbrannte Bestandteile und <strong>Ruß</strong> entstehen.</p><div class="tip">CO ist giftig, unsichtbar und geruchlos. Ein ungewöhnlicher Geruch allein ist kein zuverlässiger CO-Nachweis.</div>'],
['5 · Warum braucht man Luftüberschuss?','<p>In der Praxis wird etwas mehr Luft zugeführt als theoretisch für eine vollständige Verbrennung nötig wäre.</p><div class="formula">Luftzahl λ = tatsächlich zugeführte Luftmenge / theoretisch benötigte Luftmenge</div><p><strong>λ = 1:</strong> theoretisch genau benötigte Luftmenge. <strong>λ &gt; 1:</strong> Luftüberschuss.</p><p>Zu wenig Luft kann CO und Ruß fördern; zu viel Luft kann Abgasverluste erhöhen.</p>'],
['6 · Was könnte beim Kunden falsch laufen?','<p>Mögliche Ursachen für die Rußbildung sind beispielsweise:</p><ul><li>unzureichende Luftversorgung</li><li>schlechte Zerstäubung oder ungeeignete Brennereinstellung</li><li>verschmutzte Bauteile oder eine fehlerhafte Luft-Brennstoff-Mischung</li></ul><p>Aus der Kundenbeschreibung lässt sich die Ursache <strong>nicht sicher diagnostizieren</strong>.</p>'],
['7 · Was kontrolliert ein Fachbetrieb?','<p>Ein Fachbetrieb überprüft unter anderem Brennerzustand, Luftversorgung sowie Verbrennungs- und Abgaswerte mit geeigneten Messgeräten.</p><p>Wichtige Größen sind beispielsweise <strong>O₂, CO₂, CO, Abgastemperatur und Rußzahl</strong>.</p><div class="tip">Messwerte sind nötig, bevor Einstellungen verändert oder Aussagen zur Verbrennungsqualität getroffen werden.</div>'],
['8 · Antwort an den Kunden','<p>„Ruß kann ein Zeichen für eine unvollständige Verbrennung sein. Dabei können auch gefährliche Abgase wie Kohlenstoffmonoxid entstehen. Bitte lassen Sie die Anlage fachgerecht überprüfen. Wir kontrollieren die Verbrennungsluft, den Brenner und die Abgaswerte.“</p><p><strong>Fachliches Fazit:</strong> Gute Verbrennung braucht ausreichend Sauerstoff, gute Durchmischung und eine passende Brennereinstellung.</p>'],
['9 · Kurze Selbstkontrolle','<p>Beantworte vor dem Aufdecken:</p><ol><li>Welche drei Voraussetzungen braucht eine Verbrennung?</li><li>Was unterscheidet CO von CO₂?</li><li>Warum ist „möglichst viel Verbrennungsluft“ keine gute Grundregel?</li></ol><button class="answerbtn" id="reveal" type="button">Musterantwort zeigen</button><div class="answer" id="answer" hidden><p><strong>1.</strong> Brennstoff, Sauerstoff, Zündenergie. <strong>2.</strong> CO kann bei unvollständiger Verbrennung entstehen und ist hochgiftig; CO₂ entsteht bei vollständiger Kohlenstoffverbrennung. <strong>3.</strong> Zu viel Luft kann die Abgasverluste erhöhen. Entscheidend ist eine fachgerecht eingestellte Verbrennung.</p></div>']
];
let i=0;const stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),dots=document.getElementById('dots');function render(){stage.innerHTML='<span class="pill">Folie '+(i+1)+'</span><h2>'+slides[i][0]+'</h2>'+slides[i][1];prev.disabled=i===0;next.textContent=i===slides.length-1?'Von vorne ↻':'Weiter →';counter.textContent=(i+1)+' / '+slides.length;dots.innerHTML=slides.map((_,n)=>'<button type="button" aria-label="Folie '+(n+1)+'" '+(n===i?'aria-current="step"':'')+'></button>').join('');dots.querySelectorAll('button').forEach((b,n)=>b.onclick=()=>{i=n;render()});const r=document.getElementById('reveal');if(r)r.onclick=()=>{document.getElementById('answer').hidden=false;r.hidden=true}}prev.onclick=()=>{if(i){i--;render()}};next.onclick=()=>{i=i===slides.length-1?0:i+1;render()};render();
</script></body></html>
