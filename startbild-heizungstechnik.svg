<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#082637" flood-opacity=".30"/>
  </filter>
  <linearGradient id="frame" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#d9e1e6"/>
  </linearGradient>
</defs>
<image href="Virtuelles%20Klassenzimmer%20Heizungstechnik.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="none"/>

<!-- fest integriertes Lernlandkarten-Poster links -->
<g filter="url(#shadow)">
 <rect x="174" y="42" width="345" height="480" rx="8" fill="url(#frame)" stroke="#a8b5bd" stroke-width="5"/>
 <rect x="184" y="52" width="325" height="460" rx="4" fill="#fff"/>
 <image href="lernlandkarte-startseite.svg" x="184" y="52" width="325" height="460" preserveAspectRatio="xMidYMid slice"/>
</g>

<!-- fest integrierte Jahresreise rechts, komplett oberhalb des Monitors -->
<g filter="url(#shadow)">
 <rect x="1300" y="38" width="300" height="225" rx="8" fill="url(#frame)" stroke="#a8b5bd" stroke-width="5"/>
 <rect x="1310" y="48" width="280" height="205" rx="4" fill="#fff"/>
 <image href="jahresreise.png" x="1310" y="48" width="280" height="205" preserveAspectRatio="xMidYMid slice"/>
</g>
</svg>